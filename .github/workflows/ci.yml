name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint + Test (Python 3.11, Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Black check
        run: black --check .

      - name: Mypy (contract, analytics, report)
        run: mypy surgisight/contract surgisight/analytics surgisight/report
        # Required quality gate; failures are not suppressed.

      - name: Pytest (no postgres, no ffmpeg)
        run: pytest -q -m "not postgres and not ffmpeg" --cov=surgisight --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80

      - name: Contract and analytics coverage gate
        run: python scripts/coverage_gate.py coverage.json

      - name: Repository data and secret scan
        run: python scripts/security_check.py

      - name: Synthetic online pipeline smoke harness
        run: python scripts/performance_harness.py --seconds 30 --warmup 5

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit Python runtime dependencies
        run: pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: web
        run: npm audit --audit-level=high
