name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

jobs:
  lint-and-test:
    name: Lint + Test (Python 3.11, Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Black check
        run: black --check .

      - name: Mypy (contract, analytics, report)
        run: mypy surgisight/contract surgisight/analytics surgisight/report
        continue-on-error: true  # stubs only until WP1

      - name: Pytest (no postgres, no ffmpeg)
        run: pytest -q -m "not postgres and not ffmpeg"

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        run: npm run build
